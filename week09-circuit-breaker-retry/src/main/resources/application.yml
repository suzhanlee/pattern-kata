spring:
  application:
    name: week09-circuit-breaker-retry

  data:
    redis:
      host: localhost
      port: 6379

resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 1s

logging:
  level:
    io.github.resilience4j: debug
