spring:
  application:
    name: week01-transaction-basics

  datasource:
    url: jdbc:mysql://localhost:3306/artisan_kata?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
